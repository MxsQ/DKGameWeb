{% extends "base.html" %}

{% block title %}数据详情 - DK游戏数据平台{% endblock %}

{% block content %}
<div class="page-header">
    <h2>数据详情</h2>
    <p>查看游戏的详细数据指标</p>
</div>

<!-- 筛选控制区域 -->
<div class="filter-section">
    <div class="filter-controls">
        <div class="date-range-picker">
            <label for="dateRange">时间范围：</label>
            <input type="text" id="dateRange" class="date-range-input" placeholder="选择时间范围" readonly>
        </div>
        
        <div class="game-selector">
            <label for="game-select">选择游戏:</label>
            <select id="game-select" class="game-select">
                <option value="">全部游戏</option>
            </select>
        </div>
        
        <button id="query-btn" class="btn-primary">查询数据</button>
    </div>
</div>

<!-- 图表区块 -->
<div class="chart-section">
    <div class="section-header">
        <h3>数据图表</h3>
        <button id="toggleChartsBtn" class="charts-toggle" type="button" aria-expanded="true" title="折叠/展开">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div class="charts-grid">
        <div class="chart-container">
            <h4>新增</h4>
            <canvas id="newUserPieChart"></canvas>
        </div>
        <div class="chart-container">
            <h4>活跃</h4>
            <canvas id="activePieChart"></canvas>
        </div>
        <div class="chart-container">
            <h4>收入</h4>
            <canvas id="revenuePieChart"></canvas>
        </div>
    </div>
</div>

<!-- 报表区块 -->
<div class="data-table-section">
    <div class="section-header">
        <h3>报表</h3>
        <div class="table-info">
            <span id="data-count">共 0 条记录</span>
        </div>
    </div>
    
    <!-- 数据维度功能区 -->
    <div class="dimension-controls">
        <div class="dimension-group">
            <label>时间维度:</label>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="time-group" value="day" checked>
                    <span>日</span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-group" value="week">
                    <span>周</span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-group" value="month">
                    <span>月</span>
                </label>
            </div>
        </div>
        
        <div class="dimension-group">
            <label>分组维度:</label>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="channel-group" value="category" checked>
                    <span>分包</span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="channel-group" value="channel">
                    <span>渠道</span>
                </label>
            </div>
        </div>
    </div>
    
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th class="channel-col">渠道</th>
                    <th>日期</th>
                    <th>包类别</th>
                    <th>新增</th>
                    <th>DA新增</th>
                    <th>活跃</th>
                    <th>收入</th>
                    <th>ARPU</th>
                    <th>次留</th>
                    <th>七留</th>
                </tr>
            </thead>
            <tbody id="data-tbody">
                <tr>
                    <td colspan="10" class="no-data-message">请选择时间段并点击查询</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- 引入日期选择器库 -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<!-- 引入Chart.js图表库 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// 全局变量
let pieCharts = {
    newUser: null,
    active: null,
    revenue: null
};

// 统一的颜色映射：保证同一渠道组在三个饼图中的配色一致
const colorPalette = [
    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
    '#FF9F40', '#8DD3C7', '#FDB462', '#80B1D3', '#B3DE69',
    '#FCCDE5', '#BC80BD', '#CCEBC5', '#FFED6F'
];
const channelColorMap = {};
function getColorForChannel(channelName) {
    const key = channelName || '其它';
    if (!channelColorMap[key]) {
        const idx = Object.keys(channelColorMap).length % colorPalette.length;
        channelColorMap[key] = colorPalette[idx];
    }
    return channelColorMap[key];
}

// 自定义插件：为每个扇形绘制指示线与占比文字
// 说明：在数据集绘制完成后，遍历每个扇形，计算中角度，向外绘制指示线与文字
const leaderLinesPlugin = {
    id: 'leaderLines',
    afterDatasetsDraw(chart, args, pluginOptions) {
        const { ctx } = chart;
        const datasets = chart.data.datasets;
        if (!datasets || datasets.length === 0) return;
        const dataset = datasets[0];
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data || meta.data.length === 0) return;

        const labels = chart.data.labels || [];
        const values = dataset.data || [];
        if (labels.length !== values.length) return;

        const total = values.reduce((a, b) => a + b, 0) || 1;

        ctx.save();
        ctx.fillStyle = '#333';
        ctx.font = '12px sans-serif';

        const canvas = chart.canvas;
        const chartArea = chart.chartArea;
        const padding = 6;

        // 收集项并基于扇形中心角确定左右侧
        const items = [];
        for (let i = 0; i < meta.data.length; i++) {
            const arc = meta.data[i];
            if (!arc) continue;
            const props = arc.getProps(['x','y','startAngle','endAngle','outerRadius'], true);
            const mid = (props.startAngle + props.endAngle) / 2;
            const isRight = Math.cos(mid) >= 0;
            items.push({
                index: i,
                label: labels[i] || '',
                value: values[i] || 0,
                percent: total ? ((values[i] / total) * 100) : 0,
                isRight
            });
        }

        // 将项目按数值从大到小排序后，均匀分配到左右两列（交替或平衡数量）
        const sorted = items.slice().sort((a, b) => b.value - a.value);
        const leftItems = [];
        const rightItems = [];
        sorted.forEach((it, idx) => {
            if (leftItems.length <= rightItems.length) {
                leftItems.push(it);
            } else {
                rightItems.push(it);
            }
        });

        // 布局参数
        const lineH = 20;
        const padX = 6, padY = 4;
        const dotR = 4;
        const radius = 6;

        function drawBox(it, x, y, alignRight) {
            const text = `${it.label}: ${it.percent.toFixed(1)}%`;
            const textWidth = ctx.measureText(text).width;
            const boxW = dotR*2 + 6 + textWidth + padX*2;
            const boxH = 18;
            const minX = (chartArea.left ?? 0) + padding;
            const maxX = (chartArea.right ?? canvas.width) - padding - boxW;
            let boxX = alignRight ? Math.max(Math.min(x - boxW, maxX), minX) : Math.max(Math.min(x, maxX), minX);
            let boxY = Math.max(Math.min(y, (chartArea.bottom ?? canvas.height) - padding - boxH), (chartArea.top ?? 0) + padding);

            // 背景卡片
            ctx.beginPath();
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.strokeStyle = '#e9ecef';
            ctx.moveTo(boxX + radius, boxY);
            ctx.lineTo(boxX + boxW - radius, boxY);
            ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
            ctx.lineTo(boxX + boxW, boxY + boxH - radius);
            ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
            ctx.lineTo(boxX + radius, boxY + boxH);
            ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
            ctx.lineTo(boxX, boxY + radius);
            ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 彩色圆点
            ctx.beginPath();
            ctx.fillStyle = getColorForChannel(it.label);
            const dotCx = alignRight ? (boxX + boxW - padX - dotR) : (boxX + padX + dotR);
            ctx.arc(dotCx, boxY + boxH/2, dotR, 0, Math.PI * 2);
            ctx.fill();

            // 文本
            ctx.fillStyle = '#333';
            if (alignRight) {
                ctx.textAlign = 'right';
                ctx.fillText(text, dotCx - dotR - 6 + (padX - 2), boxY + boxH/2 + 4);
            } else {
                ctx.textAlign = 'left';
                ctx.fillText(text, dotCx + dotR + 6 - (padX - 2), boxY + boxH/2 + 4);
            }
        }

        // 左列（左对齐，从上到下），按排序等距分布
        let yL = (chartArea.top ?? 0) + padding;
        const xL = (chartArea.left ?? 0) + padding;
        const stepL = Math.max(lineH, ((chartArea.bottom ?? canvas.height) - padding - yL - padding) / Math.max(1, leftItems.length));
        leftItems.forEach((it, i) => {
            drawBox(it, xL, yL + i * stepL, false);
        });

        // 右列（右对齐，从上到下），按排序等距分布
        let yR = (chartArea.top ?? 0) + padding;
        const xR = (chartArea.right ?? canvas.width) - padding;
        const stepR = Math.max(lineH, ((chartArea.bottom ?? canvas.height) - padding - yR - padding) / Math.max(1, rightItems.length));
        rightItems.forEach((it, i) => {
            drawBox(it, xR, yR + i * stepR, true);
        });

        ctx.restore();
    }
};

// 注册插件（只需一次）
if (window.Chart && Chart.register) {
    Chart.register(leaderLinesPlugin);
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    // 初始化日期范围选择器
    initializeDateRange();
    
    // 加载游戏列表
    loadGames();
    
    // 初始化图表
    initializePieCharts();
    
    // 绑定查询按钮事件
    document.getElementById('query-btn').addEventListener('click', queryData);

    // 折叠/展开数据图表区域
    const chartsSection = document.querySelector('.chart-section');
    const toggleBtn = document.getElementById('toggleChartsBtn');
    if (toggleBtn && chartsSection) {
        toggleBtn.addEventListener('click', function() {
            chartsSection.classList.toggle('collapsed');
            const isCollapsed = chartsSection.classList.contains('collapsed');
            toggleBtn.setAttribute('aria-expanded', !isCollapsed);
            toggleBtn.setAttribute('title', isCollapsed ? '展开' : '折叠');
        });
    }
    
    // 绑定维度选择事件，选择后自动更新数据
    document.querySelectorAll('input[name="time-group"]').forEach(radio => {
        radio.addEventListener('change', queryData);
    });
    
    document.querySelectorAll('input[name="channel-group"]').forEach(radio => {
        radio.addEventListener('change', queryData);
    });
    
    // 页面加载时自动查询一次
    queryData();
});

// 初始化日期范围选择器
function initializeDateRange() {
    // 默认选择近一周
    const endDate = new Date();
    const startDate = new Date();
    startDate.setDate(endDate.getDate() - 7);
    
    $('#dateRange').daterangepicker({
        startDate: startDate,
        endDate: endDate,
        locale: {
            format: 'YYYY-MM-DD',
            separator: ' 至 ',
            applyLabel: '确定',
            cancelLabel: '取消',
            fromLabel: '从',
            toLabel: '到',
            customRangeLabel: '自定义',
            weekLabel: 'W',
            daysOfWeek: ['日', '一', '二', '三', '四', '五', '六'],
            monthNames: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'],
            firstDay: 1
        },
        opens: 'center'
    }, function(start, end, label) {
        // 日期范围改变时重新查询数据
        queryData();
    });
}

// 初始化饼图
function initializePieCharts() {
    const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        const label = context.label || '';
                        const value = context.parsed;
                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                        const percentage = ((value / total) * 100).toFixed(1);
                        return `${label}: ${value.toLocaleString()} (${percentage}%)`;
                    }
                }
            }
        }
    };

    // 新增饼图
    pieCharts.newUser = new Chart(document.getElementById('newUserPieChart'), {
        type: 'pie',
        data: {
            labels: [],
            datasets: [{
                data: [],
                backgroundColor: [],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: chartOptions
    });

    // 活跃饼图
    pieCharts.active = new Chart(document.getElementById('activePieChart'), {
        type: 'pie',
        data: {
            labels: [],
            datasets: [{
                data: [],
                backgroundColor: [],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: chartOptions
    });

    // 收入饼图
    pieCharts.revenue = new Chart(document.getElementById('revenuePieChart'), {
        type: 'pie',
        data: {
            labels: [],
            datasets: [{
                data: [],
                backgroundColor: [],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: chartOptions
    });
}

// 渠道组合并函数
function groupChannels(data) {
    const channelGroups = {};
    
    data.forEach(row => {
        let groupName = row.channel;
        
        // 渠道组合并逻辑：相似渠道合并
        if (groupName && groupName.includes('田地CPS')) {
            groupName = '田地CPS';
        }
        // 可以在这里添加更多渠道合并规则
        
        if (!channelGroups[groupName]) {
            channelGroups[groupName] = {
                channel: groupName,
                newUser: 0,
                active: 0,
                gain: 0
            };
        }
        
        channelGroups[groupName].newUser += row.newUser || 0;
        channelGroups[groupName].active += row.active || 0;
        channelGroups[groupName].gain += row.gain || 0;
    });
    
    return Object.values(channelGroups);
}

// 更新饼图数据
function updatePieCharts(data) {
    if (!data || data.length === 0) {
        // 清空图表
        Object.values(pieCharts).forEach(chart => {
            if (chart) {
                chart.data.labels = [];
                chart.data.datasets[0].data = [];
                chart.update();
            }
        });
        return;
    }
    
    // 渠道组合并
    const groupedData = groupChannels(data);
    
    // 按数值排序，显示所有渠道
    const sortedNewUser = [...groupedData].sort((a, b) => b.newUser - a.newUser);
    const sortedActive = [...groupedData].sort((a, b) => b.active - a.active);
    const sortedRevenue = [...groupedData].sort((a, b) => b.gain - a.gain);
    
    // 更新新增饼图
    updateSinglePieChart(pieCharts.newUser, sortedNewUser, 'newUser', '新增');
    
    // 更新活跃饼图
    updateSinglePieChart(pieCharts.active, sortedActive, 'active', '活跃');
    
    // 更新收入饼图
    updateSinglePieChart(pieCharts.revenue, sortedRevenue, 'gain', '收入');
}

// 更新单个饼图
function updateSinglePieChart(chart, sortedData, field, title) {
    if (!chart) return;
    
    // 显示所有渠道，不折叠
    const labels = sortedData.map(item => item.channel);
    const data = sortedData.map(item => item[field]);
    
    // 计算总数
    const total = data.reduce((sum, val) => sum + val, 0);
    
    // 更新图表标题
    const titleElement = chart.canvas.parentElement.querySelector('h4');
    if (titleElement) {
        titleElement.textContent = `${title} (总计: ${total.toLocaleString()})`;
    }
    
    // 准备颜色和边框样式，前3名突出显示
    const colors = [];
    const borderColors = [];
    const borderWidths = [];
    
    sortedData.forEach((item, index) => {
        if (index < 3) {
            // 前3名使用鲜艳颜色和粗边框
            colors.push(getColorForChannel(item.channel));
            borderColors.push('#333');
            borderWidths.push(3);
        } else {
            // 其他渠道使用较淡颜色和细边框
            colors.push(getColorForChannel(item.channel));
            borderColors.push('#fff');
            borderWidths.push(1);
        }
    });
    
    // 更新图表数据
    chart.data.labels = labels;
    chart.data.datasets[0].data = data;
    chart.data.datasets[0].backgroundColor = colors;
    chart.data.datasets[0].borderColor = borderColors;
    chart.data.datasets[0].borderWidth = borderWidths;
    // 前三名设置更大的偏移量，形成更大的“半径”视觉效果
    const offsets = sortedData.map((_, idx) => (idx < 3 ? 14 : 0));
    chart.data.datasets[0].offset = offsets;
    chart.update();
}

// 加载游戏列表
function loadGames() {
    fetch('/api/games/all')
        .then(response => response.json())
        .then(games => {
            const select = document.getElementById('game-select');
            games.forEach(game => {
                const option = document.createElement('option');
                option.value = game.id;
                option.textContent = game.name;
                select.appendChild(option);
            });
        })
        .catch(error => {
            console.error('加载游戏列表失败:', error);
        });
}

// 查询数据
function queryData() {
    const dateRange = $('#dateRange').data('daterangepicker');
    const startDate = dateRange.startDate.format('YYYY-MM-DD');
    const endDate = dateRange.endDate.format('YYYY-MM-DD');
    const gameId = document.getElementById('game-select').value;
    
    // 获取维度参数
    const timeGroup = document.querySelector('input[name="time-group"]:checked').value;
    const channelGroup = document.querySelector('input[name="channel-group"]:checked').value;
    
    console.log('查询参数:', { startDate, endDate, gameId, timeGroup, channelGroup });
    
    // 构建查询参数
    const params = new URLSearchParams({
        start_date: startDate,
        end_date: endDate,
        time_group: timeGroup,
        channel_group: channelGroup
    });
    
    if (gameId) {
        params.append('game_id', gameId);
    }
    
    const url = `/api/game-data?${params}`;
    console.log('请求URL:', url);
    
    // 显示加载状态
    const tbody = document.getElementById('data-tbody');
    tbody.innerHTML = '<tr><td colspan="10" class="loading">正在加载数据...</td></tr>';
    
    fetch(url)
        .then(response => {
            console.log('响应状态:', response.status);
            return response.json();
        })
        .then(data => {
            console.log('返回数据:', data);
            // 仅更新表格；饼图绘制将由 displayData 在 DOM 渲染完成后触发
            displayData(data);
        })
        .catch(error => {
            console.error('查询数据失败:', error);
            tbody.innerHTML = '<tr><td colspan="10" class="error">查询失败，请重试</td></tr>';
        });
}

// 显示数据
function displayData(data) {
    const tbody = document.getElementById('data-tbody');
    const countSpan = document.getElementById('data-count');
    
    if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="no-data-message">暂无数据</td></tr>';
        countSpan.textContent = '共 0 条记录';
        return;
    }
    
    // 更新记录数
    countSpan.textContent = `共 ${data.length} 条记录`;
    
    // 清空表格
    tbody.innerHTML = '';
    
    // 添加数据行
    data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="channel-col">${row.channel || '-'}</td>
            <td>${formatDate(row.date)}</td>
            <td>${row.category || '-'}</td>
            <td>${formatNumber(row.newUser)}</td>
            <td>${formatNumber(row.daNewUser)}</td>
            <td>${formatNumber(row.active)}</td>
            <td>${formatCurrency(row.gain)}</td>
            <td>${formatCurrency(row.ARPU)}</td>
            <td>${formatPercentage(row.DAY1)}</td>
            <td>${formatPercentage(row.DAY7)}</td>
        `;
        tbody.appendChild(tr);
    });

    // 等待表格 DOM 渲染完成后再绘制饼图，确保布局稳定
    requestAnimationFrame(() => updatePieCharts(data));
}

// 格式化日期
function formatDate(dateStr) {
    if (!dateStr) return '-';
    
    // 获取当前选择的时间维度
    const timeGroup = document.querySelector('input[name="time-group"]:checked').value;
    
    // 如果后端已经返回了格式化好的日期字符串（如周维度的"8/25-8/31"），直接返回
    if (timeGroup === 'week' && dateStr.includes('-') && dateStr.includes('/')) {
        return dateStr;
    }
    
    // 如果后端已经返回了格式化好的日期字符串（如月维度的"2025-8"），直接返回
    if (timeGroup === 'month' && dateStr.includes('-') && !dateStr.includes('/')) {
        return dateStr;
    }
    
    // 对于日维度或其他情况，尝试解析日期
    const date = new Date(dateStr);
    
    // 检查日期是否有效
    if (isNaN(date.getTime())) {
        return dateStr; // 如果解析失败，直接返回原字符串
    }
    
    switch (timeGroup) {
        case 'day':
            // 日：年/月/日
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}/${month}/${day}`;
        case 'week':
            // 周：月/日-月/日
            return formatWeekRange(date);
        case 'month':
            // 月：年-月
            const monthYear = date.getFullYear();
            const monthNum = date.getMonth() + 1;
            return `${monthYear}-${monthNum}`;
        default:
            return date.toLocaleDateString('zh-CN');
    }
}

// 格式化周范围
function formatWeekRange(date) {
    // 获取该周的开始日期（周一）
    const startOfWeek = new Date(date);
    const day = startOfWeek.getDay();
    const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1); // 调整为周一
    startOfWeek.setDate(diff);
    
    // 获取该周的结束日期（周日）
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 6);
    
    // 格式化显示：月/日-月/日
    const startMonth = startOfWeek.getMonth() + 1;
    const startDay = startOfWeek.getDate();
    const endMonth = endOfWeek.getMonth() + 1;
    const endDay = endOfWeek.getDate();
    
    if (startMonth === endMonth) {
        // 同一个月内
        return `${startMonth}/${startDay}-${endDay}`;
    } else {
        // 跨月
        return `${startMonth}/${startDay}-${endMonth}/${endDay}`;
    }
}

// 格式化数字
function formatNumber(num) {
    if (num === null || num === undefined) return '-';
    return num.toLocaleString('zh-CN');
}

// 格式化货币
function formatCurrency(amount) {
    if (amount === null || amount === undefined) return '-';
    return amount.toLocaleString('zh-CN', {minimumFractionDigits: 1, maximumFractionDigits: 1});
}

// 格式化百分比
function formatPercentage(value) {
    if (value === null || value === undefined || value === 0 || value === 0.0) {
        return '';
    }
    return `${(value * 100).toFixed(2)}%`;
}
