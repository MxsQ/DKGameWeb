{% extends "base.html" %}

{% block title %}配置 - DK游戏数据平台{% endblock %}

{% block content %}
<div class="page-header">
    <h2>游戏配置</h2>
    <p>在这里可以进行基础配置</p>
</div>

<button id="btn-add-game" class="btn-primary">增加游戏</button>

<!-- 自定义模态框 - 增加游戏 -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3>增加游戏</h3>
        <div class="form-group">
            <label for="game-name">游戏名</label>
            <input type="text" id="game-name" placeholder="请输入游戏名" />
        </div>
        <div class="modal-actions">
            <button id="modal-cancel" class="btn-secondary">取消</button>
            <button id="modal-confirm" class="btn-primary">确定</button>
        </div>
    </div>
</div>

<hr style="margin: 2rem 0;" />

<div>
    <h3 id="import-rainbow">导入彩虹数据</h3>
    <button id="btn-import-rainbow" class="btn-primary">导入彩虹数据</button>
</div>

<div style="margin-top: 2rem;">
    <h3 id="import-rainbow-wg">导入彩虹WG数据</h3>
    <button id="btn-import-wg" class="btn-primary">导入彩虹WG数据</button>
    <!-- 模态框 - 导入彩虹WG数据 -->
    <div id="modal-import-wg" class="modal hidden">
        <div class="modal-content">
            <h3>导入彩虹WG数据</h3>
            <div class="form-group">
                <label for="wg-game-select">选择游戏</label>
                <select id="wg-game-select"></select>
            </div>
            <div class="form-group">
                <label for="wg-excel">选择Excel文件</label>
                <input type="file" id="wg-excel" accept=".xlsx,.xls" />
            </div>
            <div class="form-group">
                <label for="wg-alias-select">WeGame别名</label>
                <select id="wg-alias-select"></select>
            </div>
            <div class="modal-actions">
                <button id="wg-cancel" class="btn-secondary">取消</button>
                <button id="wg-confirm" class="btn-primary">录入</button>
            </div>
        </div>
    </div>
</div>

<div style="margin-top: 2rem;">
    <h3 id="import-wegame">导入WeGame数据</h3>
    <button id="btn-import-wegame" class="btn-primary">导入WeGame数据</button>
    <!-- 模态框 - 导入WeGame数据 -->
    <div id="modal-import-wegame" class="modal hidden">
        <div class="modal-content">
            <h3>导入WeGame数据</h3>
            <div class="form-group">
                <label for="wegame-game">选择游戏</label>
                <select id="wegame-game"></select>
            </div>
            <div class="form-group">
                <label for="wegame-excel">选择Excel文件</label>
                <input type="file" id="wegame-excel" accept=".xlsx,.xls" />
            </div>
            <div class="modal-actions">
                <button id="wegame-cancel" class="btn-secondary">取消</button>
                <button id="wegame-confirm" class="btn-primary">录入</button>
            </div>
        </div>
    </div>
</div>

<!-- 模态框 - 导入彩虹数据 -->
<div id="modal-import-rainbow" class="modal hidden">
    <div class="modal-content">
        <h3>导入彩虹数据</h3>
        <div class="form-group">
            <label for="rainbow-game">选择游戏</label>
            <select id="rainbow-game"></select>
        </div>
        <div class="form-group">
            <label for="rainbow-excel">选择Excel文件</label>
            <input type="file" id="rainbow-excel" accept=".xlsx,.xls" />
        </div>
        <div class="modal-actions">
            <button id="import-cancel" class="btn-secondary">取消</button>
            <button id="import-confirm" class="btn-primary">录入</button>
        </div>
    </div>
</div>

<!-- 成功提示模态框（自动消失） -->
<div id="toast" class="toast hidden">
    <div class="toast-content" id="toast-content">操作成功</div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
    // 增加游戏模态框
    const modal = document.getElementById('modal');
    const openBtn = document.getElementById('btn-add-game');
    const cancelBtn = document.getElementById('modal-cancel');
    const confirmBtn = document.getElementById('modal-confirm');
    function openModal(){ modal.classList.remove('hidden'); }
    function closeModal(){ modal.classList.add('hidden'); }
    openBtn.addEventListener('click', openModal);
    cancelBtn.addEventListener('click', closeModal);
    confirmBtn.addEventListener('click', async function(){
        const name = document.getElementById('game-name').value.trim();
        if(!name){ alert('请输入游戏名'); return; }
        try{
            const res = await fetch('/api/games', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
            const data = await res.json();
            if(res.ok){ showToast('添加成功：' + (data && data.name ? data.name : '')); closeModal(); }
            else { alert((data && (data.message || data.error)) || '添加失败'); }
        }catch(err){ alert('请求失败：' + (err && err.message ? err.message : String(err))); }
    });

    // 导入彩虹数据模态框
    const importModal = document.getElementById('modal-import-rainbow');
    const importOpen = document.getElementById('btn-import-rainbow');
    const importCancel = document.getElementById('import-cancel');
    const importConfirm = document.getElementById('import-confirm');
    const gameSelect = document.getElementById('rainbow-game');
    const excelInput = document.getElementById('rainbow-excel');

    function openImport(){ importModal.classList.remove('hidden'); loadGames(); }
    function closeImport(){ importModal.classList.add('hidden'); excelInput.value=''; }
    importOpen.addEventListener('click', openImport);
    importCancel.addEventListener('click', closeImport);

    async function loadGames(){
        try{
            const res = await fetch('/api/games/all');
            const list = await res.json();
            gameSelect.innerHTML = '';
            (list || []).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                gameSelect.appendChild(opt);
            });
        }catch(e){ gameSelect.innerHTML = ''; }
    }

    importConfirm.addEventListener('click', async function(){
        const gid = gameSelect.value;
        const file = excelInput.files && excelInput.files[0];
        if(!gid){ alert('请选择游戏'); return; }
        if(!file){ alert('请选择Excel文件'); return; }

        const form = new FormData();
        form.append('game_id', gid);
        form.append('file', file);
        try{
            const res = await fetch('/api/import/rainbow', { method: 'POST', body: form });
            const raw = await res.text();
            let data; try { data = JSON.parse(raw); } catch(_) { data = { raw }; }
            if(res.ok){ 
                if (data && data.inserted !== undefined && data.updated !== undefined) {
                    showToast(`导入完成！新增 ${data.inserted} 条记录，更新 ${data.updated} 条记录，共处理 ${data.total} 条记录`);
                } else {
                    showToast('导入成功：' + ((data && data.count) || 0) + ' 条');
                }
                closeImport(); 
            }
            else {
                const parts = [];
                if(data && data.message) parts.push(data.message);
                if(data && data.error) parts.push(String(data.error));
                if(parts.length === 0 && data && data.raw) parts.push(String(data.raw));
                parts.push('HTTP ' + res.status);
                alert('导入失败：' + parts.join(' | '));
            }
        }catch(err){
            alert('请求失败：' + (err && err.message ? err.message : String(err)));
        }
    });

    // 导入WeGame数据模态框
    const wegameModal = document.getElementById('modal-import-wegame');
    const wegameOpen = document.getElementById('btn-import-wegame');
    const wegameCancel = document.getElementById('wegame-cancel');
    const wegameConfirm = document.getElementById('wegame-confirm');
    const wegameGameSelect = document.getElementById('wegame-game');
    const wegameExcelInput = document.getElementById('wegame-excel');

    function openWegame(){ wegameModal.classList.remove('hidden'); loadWegameGames(); }
    function closeWegame(){ wegameModal.classList.add('hidden'); if (wegameExcelInput) wegameExcelInput.value=''; }
    wegameOpen.addEventListener('click', openWegame);
    wegameCancel.addEventListener('click', closeWegame);

    async function loadWegameGames(){
        try{
            const res = await fetch('/api/games/all');
            const list = await res.json();
            wegameGameSelect.innerHTML = '';
            (list || []).forEach((g, idx) => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                if (idx === 0) opt.selected = true;
                wegameGameSelect.appendChild(opt);
            });
        }catch(e){ wegameGameSelect.innerHTML = ''; }
    }

    wegameConfirm.addEventListener('click', async function(){
        const gid = wegameGameSelect.value;
        const file = wegameExcelInput.files && wegameExcelInput.files[0];
        if(!gid){ alert('请选择游戏'); return; }
        if(!file){ alert('请选择Excel文件'); return; }
        const form = new FormData();
        form.append('game_id', gid);
        form.append('file', file);
        try{
            const res = await fetch('/api/import/wegame', { method: 'POST', body: form });
            const raw = await res.text();
            let data; try { data = JSON.parse(raw); } catch(_) { data = { raw }; }
            if(res.ok){
                if (data && data.inserted !== undefined && data.updated !== undefined) {
                    showToast(`导入完成！新增 ${data.inserted} 条记录，更新 ${data.updated} 条记录，共处理 ${data.total} 条记录`);
                } else {
                    showToast('导入成功：' + ((data && data.count) || 0) + ' 条');
                }
                closeWegame();
            } else {
                const parts = [];
                if(data && data.message) parts.push(data.message);
                if(data && data.error) parts.push(String(data.error));
                if(parts.length === 0 && data && data.raw) parts.push(String(data.raw));
                parts.push('HTTP ' + res.status);
                alert('导入失败：' + parts.join(' | '));
            }
        }catch(err){
            alert('请求失败：' + (err && err.message ? err.message : String(err)));
        }
    });

    // Toast 成功提示
    const toast = document.getElementById('toast');
    const toastContent = document.getElementById('toast-content');
    let toastTimer = null;
    function showToast(msg){
        toastContent.textContent = msg || '操作成功';
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }
    // 暴露到全局，便于其他脚本调用统一的提示
    window.showToast = showToast;
})();
</script>
<!-- 依赖与页面脚本（按需加载） -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/static/js/wg_import.js"></script>
{% endblock %}
